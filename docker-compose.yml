version: "3.8"

services:
  redis-onix-bpp:
    image: redis:alpine
    container_name: redis-onix-bpp
    command: redis-server --requirepass your-redis-password
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "your-redis-password", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  onix-bpp-plugin:
    image: manendrapalsingh/onix-adapter:v0.9.5
    container_name: onix-bpp-plugin
    ports:
      - "8002:8002"
    volumes:
      - ./config:/app/config
    environment:
      CONFIG_FILE: /app/config/adapter.yaml
      REDIS_PASSWORD: your-redis-password
    depends_on:
      redis-onix-bpp:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ubc_ocpi_adaptor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  ocpi-simulator:
    image: harishsahu/ocpi-simulator:v1
    container_name: ocpi-simulator
    restart: unless-stopped
    ports:
      - "6002:6002"
    networks:
      - app-network

  ubc-ocpi-adaptor:
    image: harishsahu/ubc-ocpi-adaptor-release-v2-app:v1
    container_name: ubc-ocpi-adaptor
    restart: unless-stopped
    ports:
      - "6001:6001"
    depends_on:
      - postgres
      - ocpi-simulator
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ubc_ocpi_adaptor
      OCPI_SIMULATOR_URL: http://ocpi-simulator:6002
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
